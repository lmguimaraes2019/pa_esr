services:
  app:
    build: .
    restart: unless-stopped
    volumes:
      - orc_data:/data
      - ./dados:/dados:ro        # planilhas de origem, só para a carga inicial
    expose: ["8000"]
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [app]
volumes:
  orc_data:
  caddy_data:
