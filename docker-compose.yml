# O Traefik que já roda na VPS (rede host, provedor Docker, resolvedor "letsencrypt") faz o HTTPS.
services:
  app:
    build: .
    restart: unless-stopped
    volumes:
      - orc_data:/data
      - ./dados:/dados:ro        # planilhas de origem, só para a carga inicial
    ports:
      - "127.0.0.1:3004:8000"    # só local, útil para diagnóstico
    labels:
      - traefik.enable=true
      - traefik.http.routers.orcamento.rule=Host(`orcamento.lmguimaraes.com.br`)
      - traefik.http.routers.orcamento.entrypoints=websecure
      - traefik.http.routers.orcamento.tls.certresolver=letsencrypt
      - traefik.http.services.orcamento.loadbalancer.server.port=8000
      # porta 80: redireciona http para https (entrypoint "web" do Traefik)
      - traefik.http.routers.orcamento-http.rule=Host(`orcamento.lmguimaraes.com.br`)
      - traefik.http.routers.orcamento-http.entrypoints=web
      - traefik.http.routers.orcamento-http.middlewares=orcamento-https
      - traefik.http.middlewares.orcamento-https.redirectscheme.scheme=https
      - traefik.http.middlewares.orcamento-https.redirectscheme.permanent=true
volumes:
  orc_data:
